name: Live Release Smoke

on:
  workflow_run:
    workflows: ["Build and Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: live-release-smoke
  cancel-in-progress: true

jobs:
  verify-live:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify deployed release
        env:
          PLAYWRIGHT_BASE_URL: https://hustlenix.github.io/LevelUp
        run: node verify-release.mjs
